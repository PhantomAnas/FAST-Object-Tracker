name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --timeout=180
      - name: Build exe
        run: pyinstaller fast_object_tracker.spec
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FASTObjectTracker.exe -ArgumentList '--cli --version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe returned $($p.ExitCode)" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\FASTObjectTracker.exe -DestinationPath FASTObjectTracker-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FASTObjectTracker-windows.zip
            dist/FASTObjectTracker.exe
          generate_release_notes: true
